<svg xmlns="http://www.w3.org/2000/svg" width="700" height="420" viewBox="0 0 700 420" role="img" aria-labelledby="t d">
<title id="t">What runs where on the UNO Q</title>
<desc id="d">A browser or ask.py talks HTTP to Flask on port 7000. Flask and the agent loop run inside the app container at /app, alongside the Python tools. The loop reaches llama-server on the host across the container gateway on port 8081, and reaches the MCU sketch over Bridge RPC.</desc>
<style>
  .t  { font: 500 14px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .s  { font: 400 12px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .c  { font: 500 12px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .ln { fill: none; stroke: #888780; stroke-width: 1.5; }
</style>
<defs>
  <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<rect x="320" y="26" width="250" height="52" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text class="t" x="445" y="47" text-anchor="middle" fill="#2C2C2A">Browser or ask.py</text>
<text class="s" x="445" y="65" text-anchor="middle" fill="#5F5E5A">HTTP to port 7000</text>

<line x1="445" y1="82" x2="445" y2="140" class="ln" marker-end="url(#a)"/>

<rect x="50" y="106" width="600" height="120" rx="10" fill="none" stroke="#888780" stroke-width="1" stroke-dasharray="5 4"/>
<text class="c" x="66" y="124" fill="#5F5E5A">App container — /app</text>

<rect x="330" y="146" width="240" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text class="t" x="450" y="169" text-anchor="middle" fill="#3C3489">Flask + agent loop</text>
<text class="s" x="450" y="187" text-anchor="middle" fill="#534AB7">main.py, port 7000</text>

<rect x="80" y="146" width="200" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text class="t" x="180" y="169" text-anchor="middle" fill="#2C2C2A">Python tools</text>
<text class="s" x="180" y="187" text-anchor="middle" fill="#5F5E5A">tools.py, workspace</text>

<line x1="326" y1="174" x2="286" y2="174" class="ln" marker-start="url(#a)" marker-end="url(#a)"/>

<path d="M450 202 L450 262 L180 262 L180 300" class="ln" marker-start="url(#a)" marker-end="url(#a)"/>
<path d="M450 202 L450 262 L520 262 L520 300" class="ln" marker-end="url(#a)"/>

<rect x="60" y="306" width="240" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text class="t" x="180" y="329" text-anchor="middle" fill="#085041">llama-server</text>
<text class="s" x="180" y="347" text-anchor="middle" fill="#0F6E56">on the host, port 8081</text>

<rect x="400" y="306" width="240" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text class="t" x="520" y="329" text-anchor="middle" fill="#712B13">MCU sketch</text>
<text class="s" x="520" y="347" text-anchor="middle" fill="#993C1D">via Bridge RPC</text>

<text class="s" x="180" y="386" text-anchor="middle" fill="#5F5E5A">reached across the container gateway</text>
<text class="s" x="520" y="386" text-anchor="middle" fill="#5F5E5A">LED and 8x13 matrix</text>
</svg>
