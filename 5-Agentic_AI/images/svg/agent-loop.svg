<svg xmlns="http://www.w3.org/2000/svg" width="680" height="360" viewBox="0 0 680 360" role="img" aria-labelledby="t d">
<title id="t">The agent tool-calling loop</title>
<desc id="d">The conversation is sent to the model, which replies with either a tool call or plain text. A tool call is run in Python and its result appended to the conversation, which loops back to the model. Plain text ends the loop.</desc>
<style>
  .t  { font: 500 14px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .s  { font: 400 12px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .ln { fill: none; stroke: #888780; stroke-width: 1.5; }
</style>
<defs>
  <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<rect x="240" y="40" width="200" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text class="t" x="340" y="63" text-anchor="middle" fill="#2C2C2A">Conversation</text>
<text class="s" x="340" y="81" text-anchor="middle" fill="#5F5E5A">Prompt, tools, history</text>

<line x1="340" y1="100" x2="340" y2="144" class="ln" marker-end="url(#a)"/>

<rect x="240" y="150" width="200" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text class="t" x="340" y="173" text-anchor="middle" fill="#3C3489">Model decides</text>
<text class="s" x="340" y="191" text-anchor="middle" fill="#534AB7">Tool call or plain text?</text>

<path d="M340 206 L340 250 L175 250 L175 272" class="ln" marker-end="url(#a)"/>
<path d="M340 206 L340 250 L520 250 L520 272" class="ln" marker-end="url(#a)"/>

<rect x="60" y="280" width="230" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text class="t" x="175" y="303" text-anchor="middle" fill="#085041">Tool call</text>
<text class="s" x="175" y="321" text-anchor="middle" fill="#0F6E56">Append result to messages</text>

<rect x="430" y="280" width="180" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text class="t" x="520" y="303" text-anchor="middle" fill="#712B13">Plain text</text>
<text class="s" x="520" y="321" text-anchor="middle" fill="#993C1D">Loop ends here</text>

<path d="M60 308 L34 308 L34 68 L232 68" class="ln" marker-end="url(#a)"/>
</svg>
