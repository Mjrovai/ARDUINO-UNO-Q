<svg xmlns="http://www.w3.org/2000/svg" width="700" height="440" viewBox="0 0 700 440" role="img" aria-labelledby="t d">
<title id="t">Anatomy of the board agent</title>
<desc id="d">The user asks a question in plain language. The harness, main.py, is the hub: it talks to the model, which decides what to do but never executes anything, and it runs the six tools on the model's behalf. Four tools are Python on the Linux side; two cross the Bridge to the microcontroller.</desc>
<style>
  .t  { font: 500 14px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .s  { font: 400 12px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .c  { font: 500 12px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .m  { font: 400 11px ui-monospace, SFMono-Regular, Menlo, monospace; }
  .ln { fill: none; stroke: #888780; stroke-width: 1.5; }
</style>
<defs>
  <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<rect x="215" y="26" width="445" height="400" rx="12" fill="none" stroke="#888780" stroke-width="1" stroke-dasharray="5 4"/>
<text class="c" x="231" y="45" fill="#5F5E5A">The agent = harness + model</text>

<rect x="290" y="62" width="300" height="64" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text class="t" x="440" y="87" text-anchor="middle" fill="#085041">Model — Qwen3.5</text>
<text class="s" x="440" y="107" text-anchor="middle" fill="#0F6E56">decides, and never executes anything</text>

<line x1="440" y1="192" x2="440" y2="130" class="ln" marker-start="url(#a)" marker-end="url(#a)"/>

<rect x="40" y="196" width="150" height="64" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text class="t" x="115" y="221" text-anchor="middle" fill="#2C2C2A">You</text>
<text class="s" x="115" y="241" text-anchor="middle" fill="#5F5E5A">ask in plain English</text>

<line x1="194" y1="228" x2="286" y2="228" class="ln" marker-start="url(#a)" marker-end="url(#a)"/>

<rect x="290" y="196" width="300" height="64" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.5"/>
<text class="t" x="440" y="221" text-anchor="middle" fill="#3C3489">Harness — main.py</text>
<text class="s" x="440" y="241" text-anchor="middle" fill="#534AB7">the loop, dispatch and limits you write</text>

<line x1="440" y1="264" x2="440" y2="288" class="ln" marker-start="url(#a)" marker-end="url(#a)"/>

<rect x="240" y="292" width="400" height="118" rx="10" fill="none" stroke="#888780" stroke-width="1" stroke-dasharray="3 3"/>
<text class="c" x="256" y="311" fill="#5F5E5A">Six tools the model may call</text>

<rect x="248" y="322" width="120" height="30" rx="6" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text class="m" x="308" y="341" text-anchor="middle" fill="#2C2C2A">get_system_info</text>
<rect x="380" y="322" width="120" height="30" rx="6" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text class="m" x="440" y="341" text-anchor="middle" fill="#2C2C2A">list_files</text>
<rect x="512" y="322" width="120" height="30" rx="6" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text class="m" x="572" y="341" text-anchor="middle" fill="#2C2C2A">read_file</text>

<rect x="248" y="364" width="120" height="30" rx="6" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text class="m" x="308" y="383" text-anchor="middle" fill="#2C2C2A">calculate</text>
<rect x="380" y="364" width="120" height="30" rx="6" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text class="m" x="440" y="383" text-anchor="middle" fill="#712B13">set_builtin_led</text>
<rect x="512" y="364" width="120" height="30" rx="6" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text class="m" x="572" y="383" text-anchor="middle" fill="#712B13">set_led_matrix</text>

<text class="s" x="440" y="425" text-anchor="middle" fill="#993C1D">the two shaded tools cross the Bridge to the microcontroller</text>
</svg>
