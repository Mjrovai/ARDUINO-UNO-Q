<svg xmlns="http://www.w3.org/2000/svg" width="680" height="400" viewBox="0 0 680 400" role="img" aria-labelledby="t d">
<title id="t">Where each agent tool runs on the UNO Q</title>
<desc id="d">llama-server and the agent loop run on the Linux MPU. Four tools resolve locally in Python; two cross the Bridge RPC to the Zephyr MCU sketch, which drives the onboard LED and the 8 by 13 LED matrix.</desc>
<style>
  .t  { font: 500 14px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .s  { font: 400 12px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .ln { fill: none; stroke: #888780; stroke-width: 1.5; }
</style>
<defs>
  <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<rect x="240" y="40" width="200" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text class="t" x="340" y="63" text-anchor="middle" fill="#085041">llama-server</text>
<text class="s" x="340" y="81" text-anchor="middle" fill="#0F6E56">Qwen3.5-0.8B decides</text>

<line x1="340" y1="96" x2="340" y2="124" class="ln" marker-start="url(#a)" marker-end="url(#a)"/>

<rect x="240" y="130" width="200" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text class="t" x="340" y="153" text-anchor="middle" fill="#3C3489">Agent loop</text>
<text class="s" x="340" y="171" text-anchor="middle" fill="#534AB7">DISPATCH table, main.py</text>

<path d="M340 186 L340 210 L175 210 L175 224" class="ln" marker-end="url(#a)"/>
<path d="M340 186 L340 210 L480 210 L480 224" class="ln" marker-end="url(#a)"/>

<rect x="50" y="230" width="250" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text class="t" x="175" y="253" text-anchor="middle" fill="#2C2C2A">Python tools (MPU)</text>
<text class="s" x="175" y="271" text-anchor="middle" fill="#5F5E5A">System, files, calculator</text>

<rect x="380" y="230" width="200" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text class="t" x="480" y="253" text-anchor="middle" fill="#712B13">Bridge RPC</text>
<text class="s" x="480" y="271" text-anchor="middle" fill="#993C1D">Crosses to the MCU</text>

<line x1="480" y1="286" x2="480" y2="314" class="ln" marker-end="url(#a)"/>

<rect x="380" y="320" width="200" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text class="t" x="480" y="343" text-anchor="middle" fill="#712B13">MCU sketch</text>
<text class="s" x="480" y="361" text-anchor="middle" fill="#993C1D">LED and 8x13 matrix</text>
</svg>
